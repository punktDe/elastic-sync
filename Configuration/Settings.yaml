PunktDe:
  Elastic:
    Sync:
      elasticDumpPath: '%FLOW_PATH_PACKAGES%Application/PunktDe.Elastic.Sync/Resources/Private/Library/node_modules/.bin/elasticdump'
      presets:
        production:
          remoteInstance:
            # hostname or ip of the server with the remote flow instance
            host: ~
            # ssh username
            user: ~
            # ssh port
            port: ~
            # ssh options
            sshOptions: ~
            # path on the remote server
            flowPath: ~
            # flow-context on the remote server
            flowContext: Production
          elasticsearch:
            scheme: '%env:ELASTICSEARCH_SCHEME%'
            host: '%env:ELASTICSEARCH_HOST%'
            port: '%env:ELASTICSEARCH_PORT%'
            # username and password for http basic authenticated instances, leave empty for unauthenticated ones
            username: ~
            password: ~
          indices:
            contentRepository:
              indexName: 'neos*'
#          postClone:
#            createAliases:
#              # After cloning the remote index, create the following aliases
#              neos-default: neos
